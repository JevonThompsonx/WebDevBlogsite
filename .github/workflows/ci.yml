name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege token for read-only checkout jobs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Dummy env for build — satisfies Zod schema so next build can statically generate.
    # These are CI-only placeholders, NOT production secrets. Real secrets are in Vercel env.
    env:
      AUTH_SECRET: "ci-dummy-secret-for-build-only-not-real"
      AUTH_GITHUB_ID: "ci-dummy-github-id"
      AUTH_GITHUB_SECRET: "ci-dummy-github-secret"
      ADMIN_GITHUB_ID: "104575457"
      DATABASE_URL: "file:./local.db"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ALLOWED_IMAGE_HOSTS: "images.unsplash.com"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/cwe-top-25

  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
