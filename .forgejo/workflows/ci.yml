# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
name: ci
# Runs on merge to the default branch, plus a build on Renovate PRs. The PR
# trigger exists only so the merge bot (deploy/renovate-automerge.py) can land
# a dependency update after it compiles instead of waiting for a human. Every
# other PR is skipped by the job condition below: feature branches are covered
# by the local workflow and PR-Agent, and building them here would multiply
# runner load without proving anything new.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Forgejo does not implement top-level `permissions:`; including it only
# produces a "not supported ... will be ignored" warning.

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: bun · build
    if: forgejo.event_name != 'pull_request' || startsWith(forgejo.event.pull_request.head.ref, 'renovate/')
    runs-on: forgejo-ci
    env:
      AUTH_SECRET: "ci-dummy-secret-for-build-only-not-real"
      AUTH_GITHUB_ID: "ci-dummy-github-id"
      AUTH_GITHUB_SECRET: "ci-dummy-github-secret"
      ADMIN_GITHUB_ID: "104575457"
      DATABASE_URL: "file:./local.db"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ALLOWED_IMAGE_HOSTS: "images.unsplash.com"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install
      - name: build
        run: bun run build
      - name: test
        continue-on-error: true
        run: bun run test
